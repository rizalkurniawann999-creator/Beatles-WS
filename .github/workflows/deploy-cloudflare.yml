name: Deploy to Cloudflare

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (syntax + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy-pages:
    name: Deploy frontend ke Cloudflare Pages
    needs: verify
    # Deploy hanya dari main (atau dispatch manual). Mencegah branch fitur
    # menimpa frontend produksi di Cloudflare Pages.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cek keberadaan secret
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret CLOUDFLARE_API_TOKEN belum diset. Deploy dilewati."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ke Cloudflare Pages
        if: steps.check.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=beatles-ws --branch=main
